[package]
name = "raytha"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Command-line interface for Raytha, built for LLM agents"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "rustls-no-provider", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[dev-dependencies]
shlex = "2.0.1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
